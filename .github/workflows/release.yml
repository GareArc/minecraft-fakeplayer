name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download OpenInv for compilation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lib
          DOWNLOAD_URL=$(gh api repos/lishid/OpenInv/releases/latest \
            --jq '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' \
            | head -1)
          echo "Downloading OpenInv from $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o lib/OpenInv.jar

      - name: Build release JAR
        run: ./gradlew :fakeplayer-dist:shadowJar --no-daemon

      - name: Verify JAR exists
        run: ls -lh build/libs/fakeplayer-*.jar

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "fakeplayer ${{ github.ref_name }}" \
            --generate-notes \
            build/libs/fakeplayer-*.jar
