name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download OpenInv for compilation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lib
          DOWNLOAD_URL=$(gh api repos/lishid/OpenInv/releases/latest \
            --jq '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' \
            | head -1)
          echo "Downloading OpenInv from $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o lib/OpenInv.jar

      - name: Build
        run: ./gradlew :fakeplayer-dist:shadowJar --no-daemon

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakeplayer-${{ github.sha }}
          path: build/libs/fakeplayer-*.jar
          retention-days: 7
